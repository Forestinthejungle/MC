<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e293b, var(--bg));
      color: var(--fg);
      text-align: center;
      padding: 24px;
    }
    main { max-width: 560px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 .25em; letter-spacing: -.02em; }
    .accent { color: var(--accent); }
    p { font-size: 1.1rem; line-height: 1.6; color: #94a3b8; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: .5rem 1rem;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: .85rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main>
    <h1>Witaj w <span class="accent">MC</span></h1>
    <p>Strona działa i jest hostowana przez GitHub Pages.</p>
    <span class="badge">🚀 Zbudowano z Claude Code</span>
  </main>
</body>
</html>
